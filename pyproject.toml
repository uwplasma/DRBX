[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drbx"
version = "2.2.0"
description = "JAX-first edge and scrape-off-layer plasma code with differentiable, hardware-agnostic solver infrastructure."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jax>=0.12,<0.13",
    "scipy",
    "matplotlib",
    "netCDF4",
    "rich",
    "solvax>=0.36.1",
]

[project.optional-dependencies]
essos = ["essos>=0.19.4"]
viz = ["pyvista", "imageio", "pillow"]
dev = ["pytest", "pytest-cov", "pytest-xdist"]
docs = ["mkdocs", "pymdown-extensions"]

[project.scripts]
drbx = "drbx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"drbx.data.atomic_rates" = ["*.json"]
"drbx.data.essos" = ["*.json"]
"drbx.fci_nodal.mms" = ["manufactured_ion_flow_fit.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: longer-running solver or history tests that are excluded from the default fast research gate",
    "fast: data-free nodal tests",
    "pinned_case: nodal checks using pinned resolution 16 products",
    "rebuild_case: nodal checks that rebuild a resolution 16 case",
]

[tool.coverage.run]
branch = true
source = ["src/drbx"]

[tool.coverage.report]
show_missing = true
skip_covered = false
