# HSX FCI drift-reduced Braginskii blob (drbx.fci_braginskii.run).
#
#   drbx inspect examples/inputs/hsx_fci_blob.toml   # resolved configuration
#   drbx run examples/inputs/hsx_fci_blob.toml       # builds the geometry once, then runs
#
# [geometry] builds (and caches under cache_dir) the geometry from the coils and
# vessel shipped in examples/inputs/hsx.  To use a prebuilt artifact instead, drop
# [geometry] and set geometry = "path" in [fci_braginskii].  Keys: docs/decks.md.
# The metric fit settings below are those of the docs tutorial's 16^3 grid.

[model]
backend = "fci_braginskii"

[geometry]
resolution = [16, 16, 16]
metric_mesh_shape = [16, 16, 16]
metric_poloidal_modes = 6
metric_toroidal_modes = 3
toroidal_modes = 3
cache_dir = "../../output/hsx_geometry"

[fci_braginskii]
final_time = 0.003
num_steps = 4
save_every = 1
output = "../../output/hsx_fci_blob/hsx"
